    <clipPath id="band">
      <rect x="0" y="8" width="32" height="16" />
    </clipPath>
  </defs>
  <rect width="32" height="32" fill="#1a1c1c" />
  <path
    d="M4.63 6 15.37 26M15.37 6 4.63 26"
    stroke="#B08D57"
    stroke-width="3"
    fill="none"
    clip-path="url(#band)"
  />
  <rect x="18" y="8" width="4" height="16" fill="#B08D57" />
  <rect x="24" y="8" width="4" height="16" fill="#B08D57" />
</svg>
